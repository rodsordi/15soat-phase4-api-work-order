              timeAndDescriptionUpdate:
                summary: 'Atualização de tempo estimado e escopo'
                description: 'Ajuste no tempo padrão de execução e na descrição das atividades.'
                value:
                  name: 'Troca de Óleo e Filtro com Higienização'
                  description: 'Substituição de óleo, troca de filtro e higienização do sistema'
                  estimatedMinutes: 60
              fullServiceUpdate:
                summary: 'Atualização cadastral completa do serviço'
                description: 'Revisão integral de nome, descrição, preço e tempo estimado.'
                value:
                  name: 'Troca de Óleo e Filtro de Alta Performance'
                  description: 'Substituição com óleo sintético 5W30 e filtro de alta vazão'
                  price: 180.00
                  estimatedMinutes: 60
      responses:
        '200':
          description: Serviço do catálogo atualizado com sucesso
