            Endereço de e-mail atualizado (formato RFC 5322 válido, máximo `100` caracteres).

    # -----------------------------------------------------------------------
    # Vehicle Schemas
    # -----------------------------------------------------------------------
    CreateVehicleRequest:
      type: object
      description: Requisição de cadastro de novo veículo
      required:
        - licensePlate
        - customerDocument
        - model
      properties:
        licensePlate:
          type: string
          pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$|^[A-Z]{3}-?[0-9]{4}$'
          maxLength: 10
          example: 'BRA2E19'
          description: |
            Placa identificadora do veículo (**Padrão Mercosul** `AAA0A00` ou **Tradicional** `AAA-0000`, máximo `10` caracteres).
        customerDocument:
          type: string
          pattern: '^\d{11}$|^\d{14}$'
          minLength: 11
          maxLength: 14
          example: '52998224725'
          description: |
            Número do documento de identificação fiscal do proprietário (**CPF** com `11` dígitos ou **CNPJ** com `14` dígitos, somente números).
        make:
          type: string
          minLength: 2
          maxLength: 100
          example: 'Toyota'
          description: |
            Nome da fabricante/montadora do veículo (mínimo `2`, máximo `100` caracteres).
        brand:
          type: string
          minLength: 2
          maxLength: 100
          example: 'Toyota'
          description: |
            Nome da marca/montadora (alias compatível com `make`, mínimo `2`, máximo `100` caracteres).
        model:
          type: string
          minLength: 2
          maxLength: 100
          example: 'Corolla'
          description: |
            Modelo comercial do veículo (mínimo `2`, máximo `100` caracteres).
        manufactureYear:
          type: integer
          minimum: 1900
          maximum: 2100
          example: 2023
          description: |
            Ano em que o veículo foi fisicamente fabricado (entre `1900` e `2100`).
        year:
          type: integer
          minimum: 1900
          maximum: 2100
          example: 2023
          description: |
            Ano do modelo do veículo (entre `1900` e `2100`).

    PatchVehicleRequest:
      type: object
      description: Requisição de atualização parcial dos dados do veículo
      properties:
        make:
          type: string
          minLength: 2
          maxLength: 100
          example: 'Toyota'
          description: |
            Nome atualizado da fabricante/montadora do veículo (mínimo `2`, máximo `100` caracteres).
        brand:
          type: string
          minLength: 2
          maxLength: 100
          example: 'Toyota'
          description: |
            Nome atualizado da marca/montadora (alias compatível com `make`, mínimo `2`, máximo `100` caracteres).
        model:
          type: string
          minLength: 2
          maxLength: 100
          example: 'Corolla'
          description: |
            Modelo comercial atualizado do veículo (mínimo `2`, máximo `100` caracteres).
        manufactureYear:
          type: integer
          minimum: 1900
          maximum: 2100
          example: 2024
          description: |
            Ano atualizado de fabricação do veículo (entre `1900` e `2100`).
        year:
          type: integer
          minimum: 1900
          maximum: 2100
          example: 2024
          description: |
            Ano atualizado do modelo do veículo (entre `1900` e `2100`).

    # =========================================================================
    # Vehicle Schemas (ADR-0003: DTO Granularity & Symmetry)
    # Padrões aplicados:
    # - VehicleDetailedResponse: Detalhes cadastrais completos com vínculos
    # - VehicleSummaryResponse: Resumo plano para coleções e filtros rápidos
    # - VehicleCustomerItemResponse: Item aninhado leve em Vehicle com _links.self
    # =========================================================================
    VehicleDetailedResponse:
      type: object
      description: Detalhes cadastrais completos do veículo (inclui auditoria e dados complementares)
      properties:
        id:
          type: string
          format: uuid
          example: '6c8f9b1e-3a4d-4e5f-b6a7-8c9d0e1f2a3b'
          description: |
            Identificador único universal do veículo (`UUID v4`).
        customerDocument:
          type: string
          example: '52998224725'
          description: |
            Número do documento (**CPF** / **CNPJ**) do cliente proprietário vinculado.
        customer:
          description: |
            Dados cadastrais resumidos do cliente proprietário vinculado ao veículo.
          $ref: '#/components/schemas/VehicleCustomerItemResponse'
        licensePlate:
          type: string
          example: 'BRA2E19'
          description: |
            Placa identificadora do veículo (**Padrão Mercosul** ou **Tradicional**).
        make:
          type: string
          example: 'Toyota'
          description: |
            Nome da fabricante/montadora do veículo.
        model:
          type: string
          example: 'Corolla'
          description: |
            Modelo comercial do veículo.
        manufactureYear:
          type: integer
          example: 2023
          description: |
            Ano em que o veículo foi fisicamente fabricado.
        createdAt:
          type: string
          format: date-time
          example: '2026-10-02T11:00:00Z'
          description: |
            Carimbo de data e hora em que o registro foi criado (**ISO-8601 UTC**).
        updatedAt:
          type: string
          format: date-time
          example: '2026-10-08T09:30:00Z'
          description: |
            Carimbo de data e hora da última modificação cadastral (**ISO-8601 UTC**).
        _links:
          type: object
          description: |
            Links hipermídia para navegação e transições de estado conforme padrão **HAL** / **Spring HATEOAS**.
          properties:
            self:
              $ref: '#/components/schemas/Link'

    VehicleCustomerItemResponse:
      type: object
      description: Resumo dos dados cadastrais do cliente proprietário no contexto do veículo
      properties:
        id:
          type: string
          format: uuid
          example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
          description: |
            Identificador único universal do cliente proprietário (`UUID v4`).
        name:
          type: string
          example: 'Carlos Silva'
          description: |
            Nome completo ou razão social do cliente proprietário.
        email:
          type: string
          format: email
          example: 'carlos.silva@example.com'
          description: |
            Endereço de e-mail principal para contato (**RFC 5322**).
        document:
          type: string
          example: '52998224725'
          description: |
            Número do documento fiscal (**CPF** ou **CNPJ**) do cliente.
        _links:
          type: object
          description: |
            Links hipermídia para navegação e transições de estado conforme padrão **HAL** / **Spring HATEOAS**.
          properties:
            self:
              $ref: '#/components/schemas/Link'

    VehicleSummaryResponse:
      type: object
      description: Resumo cadastral do veículo para buscas e filtros rápidos
      properties:
        id:
          type: string
          format: uuid
          example: '6c8f9b1e-3a4d-4e5f-b6a7-8c9d0e1f2a3b'
          description: |
            Identificador único universal do veículo (`UUID v4`).
        customerDocument:
          type: string
          example: '52998224725'
          description: |
            Número do documento (**CPF** / **CNPJ**) do cliente proprietário vinculado.
        customer:
          description: |
            Dados cadastrais resumidos do cliente proprietário vinculado ao veículo.
          $ref: '#/components/schemas/VehicleCustomerItemResponse'
        licensePlate:
          type: string
          example: 'BRA2E19'
          description: |
            Placa identificadora do veículo (**Padrão Mercosul** ou **Tradicional**).
        make:
          type: string
          example: 'Toyota'
          description: |
            Nome da fabricante/montadora do veículo.
        model:
          type: string
          example: 'Corolla'
          description: |
            Modelo comercial do veículo.
        manufactureYear:
          type: integer
          example: 2023
          description: |
            Ano em que o veículo foi fisicamente fabricado.
        createdAt:
          type: string
          format: date-time
          example: '2026-10-02T11:00:00Z'
          description: |
            Carimbo de data e hora em que o registro foi criado (**ISO-8601 UTC**).
        _links:
          type: object
          description: |
            Links hipermídia para navegação e transições de estado conforme padrão **HAL** / **Spring HATEOAS**.
          properties:
            self:
              $ref: '#/components/schemas/Link'

    PagedVehicleResponse:
      type: object
      description: Resposta paginada de veículos
      properties:
        content:
          type: array
          description: |
            Lista contendo os resumos dos veículos recuperados para a página atual.
          items:
            $ref: '#/components/schemas/VehicleSummaryResponse'
        _links:
          description: |
            Links hipermídia de navegação entre páginas (`self`, `first`, `prev`, `next`, `last`).
          $ref: '#/components/schemas/PageLinks'
        page:
          type: integer
          example: 0
          description: |
            Número da página atual (índice base `0`).
        size:
          type: integer
          example: 20
          description: |
            Quantidade máxima de registros por página solicitada.
        totalElements:
          type: integer
          format: int64
          example: 42
          description: |
            Quantidade total de registros encontrados na base de dados para o critério consultado.
        totalPages:
          type: integer
          example: 3
          description: |
            Quantidade total de páginas calculadas disponíveis para navegação.

    # -----------------------------------------------------------------------
    # Service Catalog Schemas
    # -----------------------------------------------------------------------
    CreateServiceCatalogRequest:
      type: object
      description: Requisição de cadastro de serviço padronizado no catálogo
      required:
        - code
        - name
        - price
      properties:
        code:
          type: string
          minLength: 3
          maxLength: 50
          example: 'SRV-OIL-01'
          description: |
            Código padronizado único do serviço no catálogo (mínimo `3`, máximo `50` caracteres).
        name:
          type: string
          minLength: 3
          maxLength: 150
          example: 'Troca de Óleo e Filtro'
          description: |
            Nome descritivo padronizado do serviço (mínimo `3`, máximo `150` caracteres).
        description:
          type: string
          maxLength: 500
          example: 'Substituição completa do óleo e filtro do motor'
          description: |
            Detalhamento técnico das atividades incluídas na execução do serviço (máximo `500` caracteres).
        price:
          type: number
          minimum: 0.01
          example: 150.00
          description: |
            Preço padrão sugerido de mão de obra (**Monetário BigDecimal**, mínimo `0.01`).

    PatchServiceCatalogRequest:
      type: object
      description: Requisição de atualização parcial dos dados do serviço no catálogo
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 150
          example: 'Troca de Óleo e Filtro de Alta Performance'
          description: |
            Nome descritivo atualizado do serviço (mínimo `3`, máximo `150` caracteres).
        description:
          type: string
          maxLength: 500
          example: 'Substituição completa do óleo 5W30 sintético e filtro'
          description: |
            Detalhamento técnico atualizado das atividades do serviço (máximo `500` caracteres).
        price:
          type: number
          minimum: 0.01
          example: 180.00
          description: |
            Preço atualizado sugerido de mão de obra (**Monetário BigDecimal**, mínimo `0.01`).
        estimatedMinutes:
          type: integer
          format: int64
          minimum: 1
          example: 60
          description: |
            Tempo médio estimado para execução das tarefas em minutos (mínimo `1`).

