    # -----------------------------------------------------------------------
    # Material Schemas
    # -----------------------------------------------------------------------
    CreateMaterialRequest:
      type: object
      description: Requisição de cadastro de peça ou material
      required:
        - sku
        - name
        - unitPrice
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 50
          example: 'PART-BRK-01'
          description: |
            Código identificador único de controle de estoque (**SKU**, mínimo `3`, máximo `50` caracteres).
        name:
          type: string
          minLength: 3
          maxLength: 150
          example: 'Pastilha de Freio Dianteira'
          description: |
            Nome descritivo padronizado da peça ou material (mínimo `3`, máximo `150` caracteres).
        description:
          type: string
          maxLength: 500
          example: 'Pastilhas cerâmicas para eixo dianteiro'
          description: |
            Descrição técnica ou especificação detalhada de aplicação do material (máximo `500` caracteres).
        unitCost:
          type: number
          minimum: 0.0
          example: 80.00
          description: |
            Custo unitário de aquisição do material (**Monetário BigDecimal**, mínimo `0.00`).
        unitPrice:
          type: number
          minimum: 0.01
          example: 140.00
          description: |
            Preço unitário de venda do material (**Monetário BigDecimal**, mínimo `0.01`).
        initialStock:
          type: integer
          minimum: 0
          example: 20
          description: |
            Quantidade física inicial disponível em estoque (número inteiro não-negativo).
        minStock:
          type: integer
          minimum: 0
          example: 5
          description: |
            Nível de estoque mínimo recomendado para acionamento de reposição.

    PatchMaterialRequest:
      type: object
      description: Requisição de atualização parcial dos dados e precificação do material
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 150
          example: 'Pastilha de Freio Cerâmica Premium'
          description: |
            Nome comercial atualizado da peça ou material (mínimo `3`, máximo `150` caracteres).
        description:
          type: string
          maxLength: 500
          example: 'Pastilhas cerâmicas para alto rendimento'
          description: |
            Descrição técnica ou especificação atualizada do material (máximo `500` caracteres).
        unitCost:
          type: number
          minimum: 0.0
          example: 85.00
          description: |
            Custo unitário de aquisição atualizado (**Monetário BigDecimal**, mínimo `0.00`).
        unitPrice:
          type: number
          minimum: 0.01
          example: 155.00
          description: |
            Preço unitário de venda atualizado (**Monetário BigDecimal**, mínimo `0.01`).
        minStock:
          type: integer
          minimum: 0
          example: 10
          description: |
            Nível de estoque mínimo recomendado atualizado.

    # =========================================================================
    # Material Schemas (ADR-0003: DTO Granularity & Symmetry)
    # Padrões aplicados:
    # - MaterialDetailedResponse: Detalhes cadastrais completos, buffer e custos
    # - MaterialSummaryResponse: Resumo plano para listagens de estoque e catálogo
