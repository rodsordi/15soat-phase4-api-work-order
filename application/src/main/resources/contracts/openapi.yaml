openapi: 3.0.3
info:
  title: API de Ordens de Serviço
  description: |
    Microsserviço responsável pela abertura, gerenciamento, orçamentação e rastreamento de Ordens de Serviço, cadastros de Clientes e Veículos, e catálogos de serviços e materiais da oficina.

    ### 📐 Padrões Arquiteturais e Conformidade Técnica (RFCs & ADRs)
    - **Navegação Hipermídia (HATEOAS / Richardson Maturity Model Nível 3)**:
      - Implementado via padrão HAL (*Hypertext Application Language* - `draft-kelly-json-hal-08` / **RFC 8288**).
      - Respostas expõem o nó `_links` contendo links de autodescoberta (`self`) e relacionamentos de dependência.
      - Suporte a templates de URI parametrizados conforme **RFC 6570** (`templated: boolean`).
      - Identificadores e referências canônicas estruturadas de acordo com **RFC 3986**.
    - **Tratamento Padronizado de Erros (RFC 7807 / RFC 9457)**:
      - Respostas de falha de validação e regras de negócio estruturadas no padrão canônico *Problem Details for HTTP APIs* (`application/problem+json`).
    - **Granularidade e Simetria de DTOs (ADR-0003)**:
      - `*SummaryResponse`: Projeção plana e leve otimizada para listagens paginadas (`Paged*Response`), contendo `_links.self` para navegação direta ao recurso completo.
      - `*DetailedResponse`: Modelo completo para consultas pontuais (`GET /{id}`), incluindo auditoria e relações expandidas.
      - `*ItemResponse`: Representação compacta embutida para entidades associadas (evita acoplamento cíclico e tráfego desnecessário de dados).
  version: 1.0.0
  contact:
    name: FIAP SOAT Architecture & Engineering Team
    url: https://github.com/15soat-org
    email: contato@fiap.com.br
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
externalDocs:
  description: Repositório e Documentação Técnica de Arquitetura (ADRs)
  url: https://github.com/15soat-org/15soat-phase4-api-work-order
servers:
  - url: http://localhost:8080
    description: Servidor de desenvolvimento local
  - url: /
    description: Gateway / Servidor Atual
security:
  - BearerAuth: []
tags:
  - name: WorkOrder
    description: |
      Operações de gestão do ciclo de vida das Ordens de Serviço.

      **Máquina de Estados e Transições de Domínio**:
      - *Fluxo Principal*: `RECEIVED` ➔ `DIAGNOSING` ➔ `WAITING_APPROVAL` ➔ `APPROVED` ➔ `EXECUTING` ➔ `COMPLETED` ➔ `DELIVERED`
      - *Desvios e Estados Terminais*:
        - `CANCELED`: Transição permitida a partir de `RECEIVED`, `DIAGNOSING` ou `WAITING_APPROVAL` (Terminal).
        - `PAYMENT_REJECTED`: Decorrente de falha na autorização de pagamento em `WAITING_APPROVAL` (permite reavaliação ou cancelamento).
        - `DELIVERED`: Conclusão com retirada do veículo pelo cliente (Terminal).
  - name: Customer
    description: Operações de cadastro e consulta de Clientes
  - name: Vehicle
    description: Operações de cadastro e consulta de Veículos
  - name: ServiceCatalog
    description: Operações do catálogo de serviços padronizados e precificação de mão de obra
  - name: Material
    description: Operações do catálogo de peças de reposição, estoque e materiais

paths:
  # =========================================================================
  # Work Order Endpoints
  # =========================================================================
  /api/v1/work-orders:
    post:
      tags:
        - WorkOrder
      summary: Criar uma nova Ordem de Serviço
      description: |
        Abre uma nova Ordem de Serviço no sistema para um cliente e veículo previamente cadastrados.
        Permite a inclusão preliminar de serviços do catálogo e materiais/peças do estoque, inicializando
        o ciclo de vida no status `RECEIVED`. Retorna o cabeçalho `Location` com a URI canônica do recurso criado
        e payload detalhado com links hipermídia HAL (`_links.self`).
      operationId: createWorkOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOrderRequest'
            examples:
              simpleDiagnosis:
                summary: Abertura simples / Diagnóstico inicial
                description: Ordem de serviço aberta sem serviços ou peças pré-alocados para triagem inicial.
                value:
                  customerDocument: '52998224725'
                  licensePlate: 'BRA2E19'
                  description: 'Ruído metálico ao acionar freios dianteiros em baixa velocidade'
                  services: []
                  materials: []
              preventiveService:
                summary: Revisão preventiva (apenas serviços)
                description: Ordem de serviço com serviço pré-cadastrado do catálogo sem requisição imediata de peças.
                value:
                  customerDocument: '52998224725'
                  licensePlate: 'BRA2E19'
                  description: 'Revisão periódica de 10.000 km com troca de óleo e filtro'
                  services:
                    - serviceId: '7c7da75e-1ced-4520-9362-e328bba8b4ae'
                      quantity: 1
                  materials: []
              fullCorrectiveMaintenance:
                summary: Manutenção corretiva completa (serviços e peças)
                description: Ordem de serviço completa envolvendo mão de obra e requisição de materiais/peças do estoque.
                value:
                  customerDocument: '52998224725'
                  licensePlate: 'BRA2E19'
                  description: 'Substituição das pastilhas de freio dianteiras e fluido de freio'
                  services:
                    - serviceId: '7c7da75e-1ced-4520-9362-e328bba8b4ae'
                      quantity: 1
                  materials:
                    - materialId: '4a1e9447-e6f1-460d-9b0d-b4b0e8c7c103'
                      quantity: 2
      responses:
        '201':
          description: Ordem de Serviço criada com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/work-orders/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - WorkOrder
      summary: Listar Ordens de Serviço com filtros opcionais e paginação
      description: |
        Recupera uma lista paginada de Ordens de Serviço em projeção resumida (`PagedWorkOrderResponse`),
        otimizada para listagens de dashboard e triagem. Suporta filtros combinados por status operacional,
        documento do cliente (CPF/CNPJ), placa do veículo, intervalo temporal de criação e ordenação dinâmica.
        Contempla links de navegação hipermídia HAL (`_links.first`, `prev`, `next`, `last`).
      operationId: listWorkOrders
      parameters:
        - name: status
          in: query
          required: false
          description: Filtrar por status da Ordem de Serviço
          schema:
            $ref: '#/components/schemas/WorkOrderStatus'
          example: 'RECEIVED'
        - name: customerDocument
          in: query
          required: false
          description: Filtrar por documento (CPF ou CNPJ) do cliente
          schema:
            type: string
            pattern: '^\d{11}$|^\d{14}$'
            minLength: 11
            maxLength: 14
          example: '52998224725'
        - name: licensePlate
          in: query
          required: false
          description: Filtrar por placa do veículo
          schema:
            type: string
            pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$|^[A-Z]{3}-?[0-9]{4}$'
            maxLength: 10
          example: 'BRA2E19'
        - $ref: '#/components/parameters/CreatedFromQueryParam'
        - $ref: '#/components/parameters/CreatedToQueryParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SortQueryParam'
      responses:
        '200':
          description: Lista paginada de Ordens de Serviço recuperada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedWorkOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/work-orders/{id}:
    get:
      tags:
        - WorkOrder
      summary: Consultar Ordem de Serviço por identificador
      description: |
        Localiza e retorna os detalhes completos de uma Ordem de Serviço específica (`WorkOrderDetailedResponse`).
        Contempla dados cadastrais do cliente e veículo, auditoria temporal, histórico e lista completa
        de itens de serviços e materiais aplicados com subtotais e link hipermídia HAL (`_links.self`).
      operationId: getWorkOrderById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Detalhes da Ordem de Serviço encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - WorkOrder
      summary: Atualizar Ordem de Serviço parcialmente (Status, etc.)
      description: |
        Aplica transições no ciclo de vida da Ordem de Serviço de acordo com a máquina de estados do domínio.
        Permite registrar justificativas operacionais para aprovação do orçamento (`APPROVED`), início da execução
        física no box (`EXECUTING`), finalização dos serviços (`COMPLETED`) ou cancelamento (`CANCELED`).
        Dispara eventos de domínio para os tópicos de mensageria correspondentes.
      operationId: updateWorkOrderStatus
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkOrderStatusRequest'
            examples:
              approveOrder:
                summary: Aprovação de orçamento (APPROVED)
                description: Cliente aprovou o orçamento gerado após diagnóstico.
                value:
                  status: 'APPROVED'
                  reason: 'Cliente aprovou o orçamento presencialmente na oficina'
              startExecution:
                summary: Início de execução (EXECUTING)
                description: Mecânico assumiu o veículo no box e iniciou o reparo.
                value:
                  status: 'EXECUTING'
                  reason: 'Veículo posicionado no elevador 02 para execução dos serviços'
              completeOrder:
                summary: Conclusão dos serviços (COMPLETED)
                description: Todos os serviços e montagens foram finalizados com teste de rodagem aprovado.
                value:
                  status: 'COMPLETED'
                  reason: 'Serviços finalizados e veículo aprovado no teste de qualidade'
              cancelOrder:
                summary: Cancelamento da ordem (CANCELED)
                description: Ordem cancelada por desistência do cliente ou inviabilidade técnica.
                value:
                  status: 'CANCELED'
                  reason: 'Cliente optou por não realizar o serviço devido ao custo das peças'
      responses:
        '200':
          description: Ordem de Serviço atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # Customer Endpoints
  # =========================================================================
  /api/v1/customers:
    post:
      tags:
        - Customer
      summary: Cadastrar um novo Cliente
      description: |
        Cadastra um novo cliente (Pessoa Física com CPF de 11 dígitos ou Pessoa Jurídica com CNPJ de 14 dígitos).
        Valida a unicidade cadastral do documento e a conformidade do endereço de e-mail.
        Retorna o recurso completo criado com o cabeçalho `Location` e links de navegação HAL.
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
            examples:
              individualCustomer:
                summary: Pessoa Física (CPF)
                description: Cadastro de cliente pessoa física com CPF de 11 dígitos numéricos.
                value:
                  document: '52998224725'
                  name: 'Carlos Silva'
                  email: 'carlos.silva@example.com'
              corporateCustomer:
                summary: Pessoa Jurídica (CNPJ)
                description: Cadastro de cliente corporativo ou frotista com CNPJ de 14 dígitos numéricos.
                value:
                  document: '12345678000195'
                  name: 'Transportadora Silva & Filhos Ltda'
                  email: 'contato@transportadorasilva.com.br'
      responses:
        '201':
          description: Cliente cadastrado com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Customer
      summary: Listar ou buscar Clientes com filtros opcionais e paginação
      description: |
        Retorna uma lista paginada de clientes em formato resumido (`PagedCustomerResponse`).
        Permite filtragem exata por CPF ou CNPJ, intervalo de datas de cadastro e paginação com
        múltiplos critérios de ordenação dinâmicos no padrão Spring Data (`sort=name,asc`).
      operationId: listCustomers
      parameters:
        - name: document
          in: query
          required: false
          description: Documento (CPF ou CNPJ) do cliente
          schema:
            type: string
            pattern: '^\d{11}$|^\d{14}$'
            minLength: 11
            maxLength: 14
          example: '52998224725'
        - $ref: '#/components/parameters/CreatedFromQueryParam'
        - $ref: '#/components/parameters/CreatedToQueryParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SortQueryParam'
      responses:
        '200':
          description: Lista paginada de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/customers/{id}:
    get:
      tags:
        - Customer
      summary: Consultar Cliente por identificador único (UUID)
      description: |
        Recupera os detalhes cadastrais completos de um cliente específico (`CustomerDetailedResponse`),
        incluindo veículos vinculados embutidos de forma leve (`CustomerVehicleItemResponse`) e links HAL.
      operationId: getCustomerById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Detalhes do cliente localizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Customer
      summary: Atualizar dados cadastrais do Cliente parcialmente
      description: |
        Atualiza campos específicos do cadastro do cliente (como nome completo, razão social ou e-mail de contato)
        sem a necessidade de reenviar o payload completo. Mantém a integridade do documento identificador.
      operationId: updateCustomer
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCustomerRequest'
            examples:
              updateEmailOnly:
                summary: Atualização apenas de e-mail de contato
                description: Atualização pontual do endereço de correio eletrônico do cliente.
                value:
                  email: 'carlos.silva.novo@example.com'
              updateNameOnly:
                summary: Atualização apenas do nome / razão social
                description: Correção cadastral do nome completo ou denominação social.
                value:
                  name: 'Carlos Eduardo da Silva'
              updateFullContact:
                summary: Atualização cadastral conjunta (nome e e-mail)
                description: Alteração simultânea do nome e e-mail de contato do cliente.
                value:
                  name: 'Carlos Eduardo da Silva'
                  email: 'carlos.silva.novo@example.com'
      responses:
        '200':
          description: Dados do cliente atualizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Customer
      summary: Excluir Cliente por identificador único (UUID)
      description: |
        Remove o cadastro do cliente pelo identificador UUID.
        **Regras de Integridade Referencial**: A exclusão é bloqueada caso o cliente possua Ordens de Serviço
        ativas ou em aberto na oficina, retornando `409 Conflict` ou `422 Unprocessable Entity` em conformidade com a RFC 7807.
      operationId: deleteCustomerById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Cliente removido com sucesso
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # Vehicle Endpoints
  # =========================================================================
  /api/v1/vehicles:
    post:
      tags:
        - Vehicle
      summary: Cadastrar um novo Veículo vinculado a um Cliente
      description: |
        Registra um novo veículo associado a um cliente proprietário previamente cadastrado na base.
        Valida o formato da placa (padrão Mercosul ou cinza tradicional de 7 caracteres)
        e a existência do cliente via documento (CPF/CNPJ). Retorna o recurso criado e links HAL.
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
            examples:
              mercosulPlate:
                summary: Placa Padrão Mercosul
                description: Cadastro de veículo com placa no padrão Mercosul (BRA2E19).
                value:
                  licensePlate: 'BRA2E19'
                  customerDocument: '52998224725'
                  make: 'Toyota'
                  model: 'Corolla Altis Hybrid'
                  manufactureYear: 2023
              traditionalPlate:
                summary: Placa Padrão Tradicional
                description: Cadastro de veículo com placa no padrão cinza tradicional (ABC-1234).
                value:
                  licensePlate: 'ABC-1234'
                  customerDocument: '12345678000195'
                  make: 'Volkswagen'
                  model: 'Delivery 9.170'
                  manufactureYear: 2021
      responses:
        '201':
          description: Veículo cadastrado com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/vehicles/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Vehicle
      summary: Listar ou buscar Veículos com filtros opcionais e paginação
      description: |
        Consulta veículos cadastrados com suporte a paginação e filtros combinados por placa (busca exata)
        e documento (CPF/CNPJ) do cliente proprietário. Retorna projeções resumidas com links de navegação HAL.
      operationId: listVehicles
      parameters:
        - name: licensePlate
          in: query
          required: false
          description: Placa do veículo (padrão Mercosul ou antigo)
          schema:
            type: string
            pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$|^[A-Z]{3}-?[0-9]{4}$'
            maxLength: 10
          example: 'BRA2E19'
        - name: customerDocument
          in: query
          required: false
          description: Documento (CPF ou CNPJ) do cliente proprietário para filtragem
          schema:
            type: string
            pattern: '^\d{11}$|^\d{14}$'
            minLength: 11
            maxLength: 14
          example: '52998224725'
        - $ref: '#/components/parameters/CreatedFromQueryParam'
        - $ref: '#/components/parameters/CreatedToQueryParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SortQueryParam'
      responses:
        '200':
          description: Lista paginada de veículos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedVehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/vehicles/{id}:
    get:
      tags:
        - Vehicle
      summary: Consultar Veículo por identificador único (UUID)
      description: |
        Retorna a representação completa dos dados cadastrais do veículo (`VehicleDetailedResponse`),
        incluindo resumo do cliente proprietário vinculado (`VehicleCustomerItemResponse`) e links HAL.
      operationId: getVehicleById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Detalhes do veículo localizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Vehicle
      summary: Atualizar dados cadastrais do Veículo parcialmente
      description: |
        Atualiza dados parciais do veículo (marca, modelo ou ano de fabricação/modelo) sem afetar
        o identificador de placa ou o vínculo de propriedade original.
      operationId: updateVehicle
