components:
  parameters:
    PageQueryParam:
      name: page
      in: query
      required: false
      description: |
        Índice da página para navegação na coleção (base zero, padrão `0`).
      schema:
        type: integer
        default: 0
        minimum: 0
      example: 0

    SizeQueryParam:
      name: size
      in: query
      required: false
      description: |
        Quantidade máxima de registros retornados por página (mínimo `1`, máximo `100`, padrão `20`).
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      example: 20

    SortQueryParam:
      name: sort
      in: query
      required: false
      description: |
        Critério de ordenação no padrão Spring Data (ex: `createdAt,desc` ou `name,asc`).
        Permite múltiplos parâmetros repetidos para ordenação composta (`explode: true`).
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      example:
        - 'createdAt,desc'

    CreatedFromQueryParam:
      name: createdFrom
      in: query
      required: false
      description: |
        Data e hora inicial para filtragem no padrão **ISO 8601 UTC** (`YYYY-MM-DDThh:mm:ssZ`).
      schema:
        type: string
        format: date-time
      example: '2026-10-01T00:00:00Z'

    CreatedToQueryParam:
      name: createdTo
      in: query
      required: false
      description: |
        Data e hora final para filtragem no padrão **ISO 8601 UTC** (`YYYY-MM-DDThh:mm:ssZ`).
      schema:
        type: string
        format: date-time
      example: '2026-10-07T23:59:59Z'

    IdPathParam:
      name: id
      in: path
      required: true
      description: |
        Identificador único universal do recurso no padrão **UUID v4** (RFC 4122).
      schema:
        type: string
        format: uuid
      example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'

    CorrelationIdHeaderParam:
      name: X-Correlation-Id
      in: header
      required: false
      description: |
        Identificador único de correlação transacional distribuída (**UUID v4**) para rastreabilidade ponta a ponta.
      schema:
        type: string
        format: uuid
      example: 'c3d8e5f2-a1b4-47d9-9e8c-7f6a5b4c3d2e'

  schemas:
    # -----------------------------------------------------------------------
    # Work Order Schemas
    # -----------------------------------------------------------------------
    CreateWorkOrderRequest:
      type: object
      description: Requisição para abertura de Ordem de Serviço na oficina
      required:
        - customerDocument
        - licensePlate
        - description
      properties:
        customerDocument:
          type: string
          pattern: '^\d{11}$|^\d{14}$'
          minLength: 11
          maxLength: 14
          example: '52998224725'
          description: |
            Documento de identificação do cliente solicitante (**CPF** com 11 dígitos ou **CNPJ** com 14 dígitos, apenas numéricos).
        licensePlate:
          type: string
          pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$|^[A-Z]{3}-?[0-9]{4}$'
          maxLength: 10
          example: 'BRA2E19'
          description: |
            Placa do veículo vinculado à ordem (padrão Mercosul `BRA2E19` ou cinza tradicional `ABC-1234`).
        description:
          type: string
          minLength: 5
          maxLength: 500
          example: 'Manutenção periódica e revisão dos freios'
          description: |
            Relato detalhado do problema mecânico, sintomas ou serviços solicitados pelo cliente.
        services:
          type: array
          description: |
            Lista opcional de serviços pré-alocados do catálogo a serem incluídos na abertura.
          items:
            $ref: '#/components/schemas/WorkOrderServiceItemRequest'
        materials:
          type: array
          description: |
            Lista opcional de peças e insumos pré-alocados do almoxarifado a serem incluídos na abertura.
          items:
            $ref: '#/components/schemas/WorkOrderMaterialItemRequest'

    WorkOrderServiceItemRequest:
      type: object
      description: Referência a serviço pré-cadastrado no catálogo
      required:
        - serviceId
        - quantity
      properties:
        serviceId:
          type: string
          format: uuid
          example: '7c7da75e-1ced-4520-9362-e328bba8b4ae'
          description: |
            Identificador único universal do serviço no catálogo (`UUID v4`).
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 1
          description: |
            Quantidade inteira de execuções do serviço a serem faturadas (mínimo `1`).

    WorkOrderMaterialItemRequest:
      type: object
      description: Referência a peça ou material pré-cadastrado no catálogo
      required:
        - materialId
        - quantity
      properties:
        materialId:
          type: string
          format: uuid
          example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'
          description: |
            Identificador único universal da peça/material no catálogo (`UUID v4`).
        quantity:
          type: integer
          minimum: 1
          default: 1
          example: 2
          description: |
            Quantidade inteira de unidades/frações do material a serem alocadas (mínimo `1`).

    WorkOrderStatus:
      type: string
      enum:
        - RECEIVED
        - DIAGNOSING
        - WAITING_APPROVAL
        - APPROVED
        - EXECUTING
        - COMPLETED
        - DELIVERED
        - CANCELED
        - PAYMENT_REJECTED
      example: 'APPROVED'
      description: |
        Status operacional do ciclo de vida da Ordem de Serviço na oficina.

        **Matriz de Transições e Regras de Negócio**:
        - `RECEIVED`: Ordem aberta na recepção, aguardando triagem mecânica inicial. Próximos válidos: `DIAGNOSING` ou `CANCELED`.
        - `DIAGNOSING`: Em análise técnica pelo mecânico e elaboração de orçamento. Próximos válidos: `WAITING_APPROVAL` ou `CANCELED`.
        - `WAITING_APPROVAL`: Orçamento emitido, aguardando aprovação do cliente. Próximos válidos: `APPROVED`, `PAYMENT_REJECTED` ou `CANCELED`.
        - `APPROVED`: Orçamento aprovado e pagamento pré-autorizado. Próximo válido: `EXECUTING`.
        - `EXECUTING`: Manutenção física em andamento com alocação de peças. Próximo válido: `COMPLETED`.
        - `COMPLETED`: Manutenções finalizadas e testes de qualidade aprovados. Próximo válido: `DELIVERED`.
        - `DELIVERED`: Veículo liberado e entregue ao proprietário (Estado Terminal).
        - `CANCELED`: Ordem cancelada por desistência ou inviabilidade técnica (Estado Terminal).
        - `PAYMENT_REJECTED`: Pagamento não aprovado ou recusado pela operadora. Próximos válidos: `WAITING_APPROVAL` ou `CANCELED`.

