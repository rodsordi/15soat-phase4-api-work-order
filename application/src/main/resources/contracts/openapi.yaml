      summary: Remover item do catálogo de serviços
      description: |
        Exclui um serviço do catálogo da oficina.
        **Regras de Integridade Referencial**: A exclusão é impedida caso o serviço esteja alocado em Ordens
        de Serviço ativas ou em andamento, retornando `409 Conflict` ou `422 Unprocessable Entity`.
      operationId: deleteServiceById
      parameters:
