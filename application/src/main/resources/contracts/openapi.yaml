  # =========================================================================
  # Service Catalog Endpoints
  # =========================================================================
  /api/v1/services:
    post:
      tags:
        - ServiceCatalog
      summary: Cadastrar um novo serviço padronizado no catálogo
      description: |
        Adiciona uma nova atividade padronizada de mão de obra ao catálogo de serviços da oficina.
        Exige código padronizado único (ex: `SRV-OIL-01`), nomenclatura descritiva e preço base de mão de obra (BigDecimal).
        Retorna o serviço criado com cabeçalho `Location` e links de autodescoberta HAL.
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceCatalogRequest'
            examples:
              preventiveQuickService:
                summary: 'Serviço Preventivo e Rápido (Troca de Óleo)'
                description: 'Cadastro de serviço recorrente de rotina e baixa complexidade.'
                value:
                  code: 'SRV-OIL-01'
                  name: 'Troca de Óleo e Filtro'
                  description: 'Substituição completa do lubrificante de motor e elemento filtrante'
                  price: 150.00
              correctiveComplexService:
                summary: 'Serviço Corretivo Complexo (Kit de Embreagem)'
                description: 'Cadastro de manutenção mecânica pesada com desmontagem e regulagem.'
                value:
                  code: 'SRV-CLU-02'
                  name: 'Substituição do Kit de Embreagem'
                  description: 'Substituição de platô, disco, colar de desengate e alinhamento'
                  price: 680.00
      responses:
        '201':
          description: Serviço cadastrado no catálogo com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/services/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - ServiceCatalog
      summary: Listar todos os serviços do catálogo com filtro por código e paginação
      description: |
        Recupera o catálogo de serviços em lista paginada (`PagedServiceCatalogResponse`).
        Permite busca exata por código de serviço, paginação e ordenação dinâmica com links de navegação HAL.
      operationId: listServices
      parameters:
        - name: code
          in: query
          required: false
          description: Código padronizado do serviço para filtragem exata
          schema:
            type: string
          example: 'SRV-OIL-01'
        - $ref: '#/components/parameters/CreatedFromQueryParam'
        - $ref: '#/components/parameters/CreatedToQueryParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SortQueryParam'
      responses:
        '200':
          description: Lista paginada de serviços do catálogo recuperada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedServiceCatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/services/metrics:
    get:
      tags:
