          type: string
          format: uuid
          description: Identificador único do cliente
        name:
          type: string
          description: Nome completo
        email:
          type: string
          description: E-mail cadastrado
        document:
          type: string
          description: CPF ou CNPJ formatado ou numérico
        createdAt:
          type: string
          format: date-time
          description: Data e hora do cadastro
        updatedAt:
          type: string
          format: date-time
          description: Data e hora da última atualização

    PatchCustomerRequest:
      type: object
