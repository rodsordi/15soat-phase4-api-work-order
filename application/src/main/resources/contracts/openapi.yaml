    # =========================================================================
    # Hypermedia Link Schema (RFC 8288 / HAL Specification)
    # Padrão: Richardson Maturity Model Level 3 & RFC 6570 (URI Template)
    # Decisão de Design: O atributo 'example' adota URI canônica neutra
    # (/api/v1/resources/{id}) para evitar acoplamento a domínios específicos
    # em schemas genéricos e reutilizáveis entre múltiplos recursos.
    # =========================================================================
    Link:
      type: object
      description: Link hipermídia conforme especificação HAL / RFC 8288
      required:
        - href
      properties:
        href:
          type: string
          example: '/api/v1/resources/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          description: |
            URI de destino do recurso ou ação hipermídia (RFC 3986).
        templated:
          type: boolean
          example: false
          description: |
            Indica se a URI é parametrizada no formato URI Template (RFC 6570).

    PageLinks:
      type: object
      description: Conjunto de links hipermídia de paginação conforme padrão HAL / RFC 8288
      properties:
        self:
          description: |
            Link hipermídia para a própria página atual da coleção (RFC 8288 / HAL).
          $ref: '#/components/schemas/Link'
        first:
          description: |
            Link hipermídia para a primeira página da coleção (RFC 8288 / HAL).
          $ref: '#/components/schemas/Link'
        prev:
          description: |
            Link hipermídia para a página anterior, omitido se estiver na primeira (RFC 8288 / HAL).
          $ref: '#/components/schemas/Link'
        next:
          description: |
            Link hipermídia para a próxima página, omitido se estiver na última (RFC 8288 / HAL).
          $ref: '#/components/schemas/Link'
        last:
          description: |
            Link hipermídia para a última página da coleção (RFC 8288 / HAL).
          $ref: '#/components/schemas/Link'
      example:
        self:
          href: '/api/v1/resources?page=1&size=20'
        first:
          href: '/api/v1/resources?page=0&size=20'
        prev:
          href: '/api/v1/resources?page=0&size=20'
        next:
          href: '/api/v1/resources?page=2&size=20'
        last:
          href: '/api/v1/resources?page=3&size=20'

    PagedWorkOrderResponse:
      type: object
      description: Resposta paginada de Ordens de Serviço
      properties:
        content:
          type: array
          description: |
            Coleção contendo as projeções resumidas das Ordens de Serviço (`WorkOrderSummaryResponse`).
          items:
            $ref: '#/components/schemas/WorkOrderSummaryResponse'
        _links:
          description: |
