        - quantity
      properties:
        serviceId:
          type: string
          format: uuid
          example: '7c7da75e-1ced-4520-9362-e328bba8b4ae'
          description: Identificador único do serviço no catálogo
        quantity:
          type: integer
          minimum: 1
          default: 1
