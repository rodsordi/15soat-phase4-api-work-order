openapi: 3.0.3
info:
  title: API de Ordens de Serviço
  description: Microsserviço responsável pela abertura, gerenciamento, orçamentação e rastreamento de Ordens de Serviço, cadastros de Clientes e Veículos, e catálogos de serviços e materiais da oficina.
  version: 1.0.0
servers:
  - url: /
    description: Servidor Atual
tags:
  - name: WorkOrder
    description: Operações de gestão do ciclo de vida das Ordens de Serviço
  - name: Customer
    description: Operações de cadastro e consulta de Clientes
  - name: Vehicle
    description: Operações de cadastro e consulta de Veículos
  - name: ServiceCatalog
    description: Operações do catálogo de serviços padronizados e precificação de mão de obra
  - name: Material
    description: Operações do catálogo de peças de reposição, estoque e materiais

paths:
  # =========================================================================
  # Work Order Endpoints
  # =========================================================================
  /api/v1/work-orders:
    post:
      tags:
        - WorkOrder
      summary: Criar uma nova Ordem de Serviço
      operationId: createWorkOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOrderRequest'
      responses:
        '201':
          description: Ordem de Serviço criada com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/work-orders/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      tags:
        - WorkOrder
      summary: Listar Ordens de Serviço com filtros opcionais e paginação
      operationId: listWorkOrders
      parameters:
        - name: status
          in: query
          required: false
          description: Filtrar por status da Ordem de Serviço
          schema:
            type: string
        - name: customerDocument
          in: query
          required: false
          description: Filtrar por documento (CPF ou CNPJ) do cliente
          schema:
            type: string
        - name: licensePlate
          in: query
          required: false
          description: Filtrar por placa do veículo
          schema:
            type: string
        - name: createdFrom
          in: query
          required: false
          description: Data/hora inicial de criação (ISO 8601 UTC)
          schema:
            type: string
            format: date-time
          example: '2026-10-01T00:00:00Z'
        - name: createdTo
          in: query
          required: false
          description: Data/hora final de criação (ISO 8601 UTC)
          schema:
            type: string
            format: date-time
          example: '2026-10-07T23:59:59Z'
        - name: page
          in: query
          required: false
          description: Índice da página (iniciando em 0)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: Quantidade máxima de registros retornados por página
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista paginada de Ordens de Serviço recuperada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedWorkOrderResponse'

  /api/v1/work-orders/{id}:
    get:
      tags:
        - WorkOrder
      summary: Consultar Ordem de Serviço por identificador
      operationId: getWorkOrderById
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único da Ordem de Serviço
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes da Ordem de Serviço encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/work-orders/{id}/status:
    patch:
      tags:
        - WorkOrder
      summary: Atualizar status da Ordem de Serviço (Aprovar, Cancelar, etc.)
      operationId: updateWorkOrderStatus
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único da Ordem de Serviço
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStatusRequest'
      responses:
        '200':
          description: Status da Ordem de Serviço atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/v1/work-orders/metrics/average-time:
    get:
      tags:
        - WorkOrder
      summary: Apurar e consultar métricas de tempo médio de execução dos serviços
      operationId: getAverageExecutionTimeMetrics
      responses:
        '200':
          description: Métricas de tempo médio de execução dos serviços recuperadas com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ServiceAverageTimeMetricResponse'

  # =========================================================================
  # Customer Endpoints
  # =========================================================================
  /api/v1/customers:
    post:
      tags:
        - Customer
      summary: Cadastrar um novo Cliente
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Cliente cadastrado com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      tags:
        - Customer
      summary: Consultar Cliente por documento (CPF ou CNPJ)
      operationId: getCustomerByDocument
      parameters:
        - name: document
          in: query
          required: false
          description: Documento (CPF ou CNPJ) do cliente
          schema:
            type: string
          example: '52998224725'
        - name: createdFrom
          in: query
          required: false
          description: Data/hora inicial de criação (ISO 8601 UTC)
          schema:
            type: string
            format: date-time
          example: '2026-10-01T00:00:00Z'
        - name: createdTo
          in: query
          required: false
          description: Data/hora final de criação (ISO 8601 UTC)
          schema:
            type: string
            format: date-time
          example: '2026-10-07T23:59:59Z'
      responses:
        '200':
          description: Detalhes do cliente localizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/customers/{id}:
    get:
      tags:
        - Customer
      summary: Consultar Cliente por identificador único (UUID)
      operationId: getCustomerById
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do cliente
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes do cliente localizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Customer
      summary: Atualizar dados cadastrais do Cliente parcialmente
      operationId: updateCustomer
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do cliente
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCustomerRequest'
      responses:
        '200':
          description: Dados do cliente atualizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags:
        - Customer
      summary: Excluir Cliente por identificador único (UUID)
      operationId: deleteCustomerById
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do cliente
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Cliente removido com sucesso
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # =========================================================================
  # Vehicle Endpoints
  # =========================================================================
  /api/v1/vehicles:
    post:
      tags:
        - Vehicle
      summary: Cadastrar um novo Veículo vinculado a um Cliente
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
      responses:
        '201':
          description: Veículo cadastrado com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/vehicles/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      tags:
        - Vehicle
      summary: Consultar Veículo por placa
      operationId: getVehicleByLicensePlate
      parameters:
        - name: licensePlate
          in: query
          required: false
          description: Placa do veículo (padrão Mercosul ou antigo)
          schema:
            type: string
          example: 'BRA2E19'
        - name: createdFrom
          in: query
          required: false
          description: Data/hora inicial de criação (ISO 8601 UTC)
          schema:
            type: string
            format: date-time
          example: '2026-10-01T00:00:00Z'
        - name: createdTo
          in: query
          required: false
          description: Data/hora final de criação (ISO 8601 UTC)
          schema:
            type: string
            format: date-time
          example: '2026-10-07T23:59:59Z'
      responses:
        '200':
          description: Detalhes do veículo localizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/vehicles/{id}:
    get:
      tags:
        - Vehicle
      summary: Consultar Veículo por identificador único (UUID)
      operationId: getVehicleById
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do veículo
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes do veículo localizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Vehicle
      summary: Atualizar dados cadastrais do Veículo parcialmente
      operationId: updateVehicle
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do veículo
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchVehicleRequest'
      responses:
        '200':
          description: Dados do veículo atualizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags:
        - Vehicle
      summary: Excluir Veículo por identificador único (UUID)
      operationId: deleteVehicleById
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do veículo
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Veículo removido com sucesso
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  # =========================================================================
  # Service Catalog Endpoints
  # =========================================================================
  /api/v1/services:
    post:
      tags:
        - ServiceCatalog
      summary: Cadastrar um novo serviço padronizado no catálogo
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceCatalogRequest'
      responses:
        '201':
          description: Serviço cadastrado no catálogo com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/services/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      tags:
        - ServiceCatalog
      summary: Listar todos os serviços do catálogo com filtro por código e paginação
      operationId: listServices
      parameters:
        - name: code
          in: query
          required: false
          description: Código padronizado do serviço para filtragem exata
          schema:
            type: string
          example: 'SRV-OIL-01'
        - name: createdFrom
          in: query
          required: false
          description: Data/hora inicial de criação (ISO 8601 UTC)
          schema:
            type: string
            format: date-time
          example: '2026-10-01T00:00:00Z'
        - name: createdTo
          in: query
          required: false
          description: Data/hora final de criação (ISO 8601 UTC)
          schema:
            type: string
            format: date-time
          example: '2026-10-07T23:59:59Z'
        - name: page
          in: query
          required: false
          description: Índice da página (iniciando em 0)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: Quantidade máxima de registros retornados por página
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista paginada de serviços do catálogo recuperada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedServiceCatalogResponse'

  /api/v1/services/{id}:
    get:
      tags:
        - ServiceCatalog
      summary: Consultar serviço do catálogo por ID
      operationId: getServiceById
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do serviço
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes do serviço localizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - ServiceCatalog
      summary: Atualizar dados cadastrais ou preço de um serviço no catálogo
      operationId: updateService
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do serviço
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchServiceCatalogRequest'
      responses:
        '200':
          description: Serviço do catálogo atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags:
        - ServiceCatalog
      summary: Remover item do catálogo de serviços
      operationId: deleteService
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do serviço
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Serviço removido com sucesso
        '404':
          $ref: '#/components/responses/NotFound'

  # =========================================================================
  # Material Catalog Endpoints
  # =========================================================================
  /api/v1/materials:
    post:
      tags:
        - Material
      summary: Cadastrar uma nova peça ou material no catálogo
      operationId: createMaterial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaterialRequest'
      responses:
        '201':
          description: Material cadastrado com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/materials/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    get:
      tags:
        - Material
      summary: Listar todas as peças e materiais com filtro por SKU e paginação
      operationId: listMaterials
      parameters:
        - name: sku
          in: query
          required: false
          description: SKU único da peça/material para filtragem exata
          schema:
            type: string
          example: 'PART-BRK-01'
        - name: createdFrom
          in: query
          required: false
          description: Data/hora inicial de criação (ISO 8601 UTC)
          schema:
            type: string
            format: date-time
          example: '2026-10-01T00:00:00Z'
        - name: createdTo
          in: query
          required: false
          description: Data/hora final de criação (ISO 8601 UTC)
          schema:
            type: string
            format: date-time
          example: '2026-10-07T23:59:59Z'
        - name: page
          in: query
          required: false
          description: Índice da página (iniciando em 0)
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          required: false
          description: Quantidade máxima de registros retornados por página
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Lista paginada de materiais recuperada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMaterialResponse'

  /api/v1/materials/{id}:
    get:
      tags:
        - Material
      summary: Consultar detalhes de um material por ID
      operationId: getMaterialById
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do material
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalhes do material localizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    patch:
      tags:
        - Material
      summary: Atualizar dados cadastrais, preços de venda ou custo de um material
      operationId: updateMaterial
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do material
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMaterialRequest'
      responses:
        '200':
          description: Material atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

    delete:
      tags:
        - Material
      summary: Remover material do catálogo
      operationId: deleteMaterial
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador único do material
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Material removido com sucesso
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    # -----------------------------------------------------------------------
    # Work Order Schemas
    # -----------------------------------------------------------------------
    CreateWorkOrderRequest:
      type: object
      description: Requisição para abertura de Ordem de Serviço
      required:
        - customerDocument
        - licensePlate
        - description
      properties:
        customerDocument:
          type: string
          example: '52998224725'
          description: Documento (CPF ou CNPJ) do cliente solicitante
        licensePlate:
          type: string
          example: 'BRA2E19'
          description: Placa do veículo associado
        description:
          type: string
          example: 'Manutenção periódica e revisão dos freios'
          description: Descrição do problema ou solicitação relatada

    UpdateStatusRequest:
      type: object
      description: Requisição para atualização de status da Ordem de Serviço
      required:
        - status
      properties:
        status:
          type: string
          enum: [RECEIVED, DIAGNOSING, WAITING_APPROVAL, WAITING_FOR_APPROVAL, APPROVED, EXECUTING, COMPLETED, DELIVERED, CANCELED]
          example: 'APPROVED'
          description: Novo status da Ordem de Serviço
        reason:
          type: string
          example: 'Cliente aprovou o orçamento'
          description: Justificativa da alteração de status

    WorkOrderServiceItemResponse:
      type: object
      description: Item de mão de obra/serviço incluído na Ordem de Serviço
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único do item
        serviceId:
          type: string
          format: uuid
          description: Identificador do serviço no catálogo
        itemName:
          type: string
          description: Nome do serviço no momento da inclusão
        itemCode:
          type: string
          description: Código do serviço no momento da inclusão
        unitPrice:
          type: number
          format: double
          description: Preço unitário aplicado
        quantity:
          type: integer
          description: Quantidade aplicada
        subtotal:
          type: number
          format: double
          description: Subtotal deste item
        createdAt:
          type: string
          format: date-time
          description: Data e hora de inclusão do item

    WorkOrderMaterialItemResponse:
      type: object
      description: Item de peça/material incluído na Ordem de Serviço
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único do item
        materialId:
          type: string
          format: uuid
          description: Identificador da peça no catálogo
        itemName:
          type: string
          description: Nome da peça no momento da inclusão
        itemSku:
          type: string
          description: SKU da peça no momento da inclusão
        unitPrice:
          type: number
          format: double
          description: Preço unitário aplicado
        quantity:
          type: integer
          description: Quantidade utilizada
        subtotal:
          type: number
          format: double
          description: Subtotal deste material
        createdAt:
          type: string
          format: date-time
          description: Data e hora de inclusão da peça

    WorkOrderStatusHistoryResponse:
      type: object
      description: Registro histórico de transição de status da Ordem de Serviço
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único do registro de histórico
        fromStatus:
          type: string
          description: Status anterior
        toStatus:
          type: string
          description: Status resultante
        reason:
          type: string
          description: Motivo ou justificativa da transição
        changedAt:
          type: string
          format: date-time
          description: Data e hora da transição
        changedBy:
          type: string
          description: Responsável ou sistema que realizou a alteração

    WorkOrderResponse:
      type: object
      description: Dados consolidados da Ordem de Serviço
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único da Ordem de Serviço
        customerDocument:
          type: string
          description: Documento do cliente
        licensePlate:
          type: string
          description: Placa do veículo
        status:
          type: string
          description: Status atual da Ordem de Serviço
        description:
          type: string
          description: Descrição do atendimento
        totalAmount:
          type: number
          format: double
          description: Valor total acumulado (serviços + peças)
        services:
          type: array
          description: Lista de serviços adicionados
          items:
            $ref: '#/components/schemas/WorkOrderServiceItemResponse'
        materials:
          type: array
          description: Lista de materiais adicionados
          items:
            $ref: '#/components/schemas/WorkOrderMaterialItemResponse'
        statusHistory:
          type: array
          description: Trilha de auditoria das transições de status
          items:
            $ref: '#/components/schemas/WorkOrderStatusHistoryResponse'
        createdAt:
          type: string
          format: date-time
          description: Data e hora de abertura
        updatedAt:
          type: string
          format: date-time
          description: Data e hora da última modificação

    PagedWorkOrderResponse:
      type: object
      description: Resposta paginada de Ordens de Serviço
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderResponse'
        page:
          type: integer
          example: 0
          description: Índice da página atual
        size:
          type: integer
          example: 20
          description: Quantidade máxima de registros por página
        totalElements:
          type: integer
          format: int64
          example: 42
          description: Quantidade total de registros encontrados
        totalPages:
          type: integer
          example: 3
          description: Quantidade total de páginas disponíveis

    ServiceAverageTimeMetricResponse:
      type: object
      description: Métrica de tempo médio real apurado para um serviço
      properties:
        serviceId:
          type: string
          format: uuid
          description: Identificador do serviço
        serviceCode:
          type: string
          example: 'SRV-OIL-01'
          description: Código identificador do serviço
        serviceName:
          type: string
          example: 'Troca de Óleo e Filtro'
          description: Nome do serviço
        averageMinutes:
          type: integer
          format: int64
          example: 45
          description: Média de duração calculada em minutos
        totalCompletedOrders:
          type: integer
          format: int64
          example: 12
          description: Quantidade total de ordens concluídas consideradas na média

    # -----------------------------------------------------------------------
