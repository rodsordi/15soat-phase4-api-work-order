      summary: Apurar e consultar métricas de tempo médio de execução dos serviços do catálogo
      description: |
        Calcula e consolida indicadores de desempenho operacional da oficina, apurando a média real de duração
        (em minutos) com base nas Ordens de Serviço finalizadas no histórico. Permite filtro por serviço específico.
      operationId: getServiceMetrics
      parameters:
        - name: serviceCode
