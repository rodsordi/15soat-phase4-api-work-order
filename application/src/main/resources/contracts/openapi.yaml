    CreateCustomerRequest:
      type: object
      description: Requisição de cadastro de novo cliente
      required:
        - document
        - name
        - email
      properties:
        document:
          type: string
          pattern: '^\d{11}$|^\d{14}$'
          minLength: 11
          maxLength: 14
          example: '52998224725'
          description: CPF (11 dígitos) ou CNPJ (14 dígitos) do cliente (apenas dígitos numéricos)
        name:
          type: string
          minLength: 3
          maxLength: 150
          example: 'Carlos Silva'
          description: Nome completo ou razão social
        email:
          type: string
          format: email
          maxLength: 100
          example: 'carlos.silva@example.com'
          description: Endereço de e-mail de contato

