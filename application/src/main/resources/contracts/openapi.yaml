          type: string
          format: date-time
          description: Data e hora de abertura

    # =========================================================================
    # Hypermedia Link Schema (RFC 8288 / HAL Specification)
    # Padrão: Richardson Maturity Model Level 3 & RFC 6570 (URI Template)
    # Decisão de Design: O atributo 'example' adota URI canônica neutra
    # (/api/v1/resources/{id}) para evitar acoplamento a domínios específicos
    # em schemas genéricos e reutilizáveis entre múltiplos recursos.
    # =========================================================================
    Link:
      type: object
      description: Link hipermídia conforme especificação HAL / RFC 8288
      required:
        - href
      properties:
        href:
          type: string
          example: '/api/v1/resources/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          description: URI de destino do recurso ou ação hipermídia
        templated:
          type: boolean
          example: false
          description: Indica se a URI é um URI Template (RFC 6570)

    PageLinks:
      type: object
      description: Hypermedia pagination links conforming to HAL / RFC 8288 specification
      properties:
        self:
          $ref: '#/components/schemas/Link'
        first:
          $ref: '#/components/schemas/Link'
        prev:
          $ref: '#/components/schemas/Link'
        next:
          $ref: '#/components/schemas/Link'
        last:
          $ref: '#/components/schemas/Link'

    PagedWorkOrderResponse:
      type: object
      description: Resposta paginada de Ordens de Serviço
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrderSummaryResponse'
        _links:
          $ref: '#/components/schemas/PageLinks'
        page:
          type: integer
          example: 0
          description: Índice da página atual
        size:
          type: integer
          example: 20
          description: Quantidade máxima de registros por página
        totalElements:
          type: integer
          format: int64
          example: 42
          description: Quantidade total de registros encontrados
        totalPages:
          type: integer
          example: 3
          description: Quantidade total de páginas disponíveis

    ServiceAverageTimeMetricResponse:
      type: object
      description: Métrica de tempo médio real apurado para um serviço
      properties:
        serviceId:
          type: string
          format: uuid
          description: Identificador do serviço
        serviceCode:
          type: string
          example: 'SRV-OIL-01'
          description: Código identificador do serviço
        serviceName:
          type: string
          example: 'Troca de Óleo e Filtro'
          description: Nome do serviço
        averageMinutes:
          type: integer
          format: int64
          example: 45
          description: Média de duração calculada em minutos
        totalCompletedOrders:
          type: integer
          format: int64
          example: 12
          description: Quantidade total de ordens concluídas consideradas na média

    ServiceMetricsResponse:
      type: object
      description: Métricas agregadas e consolidadas de serviços do catálogo
      properties:
