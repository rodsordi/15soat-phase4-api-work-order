        estimatedMinutes:
          type: integer
          format: int64
          minimum: 1
          example: 60
          description: Tempo estimado de execução em minutos

    # =========================================================================
    # Service Catalog Schemas (ADR-0003: DTO Granularity & Symmetry)
    # Padrões aplicados:
    # - ServiceCatalogDetailedResponse: Detalhes completos do catálogo de serviços
    # - ServiceCatalogSummaryResponse: Resumo plano para listagens e seleções
    # =========================================================================
    ServiceCatalogDetailedResponse:
      type: object
      description: Detalhes completos do serviço no catálogo (inclui descrições e histórico)
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único do serviço
        code:
          type: string
          description: Código padronizado
        name:
          type: string
          description: Nome do serviço
        description:
          type: string
          description: Descrição do serviço
        price:
          type: number
          format: double
          description: Preço atual da mão de obra
        estimatedMinutes:
          type: integer
          format: int64
          description: Tempo médio real de execução apurado em minutos
        createdAt:
          type: string
          format: date-time
          description: Data e hora de criação
        updatedAt:
          type: string
          format: date-time
          description: Data e hora da última atualização
        _links:
          type: object
          description: Links hipermídia para navegação conforme padrão HAL / Spring HATEOAS
          properties:
            self:
              $ref: '#/components/schemas/Link'

    ServiceCatalogSummaryResponse:
      type: object
      description: Resumo plano do serviço para listagens e seleções no catálogo
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único do serviço
        code:
          type: string
          description: Código padronizado
        name:
          type: string
          description: Nome do serviço
        price:
          type: number
          format: double
          description: Preço atual da mão de obra
        estimatedMinutes:
          type: integer
          format: int64
          description: Tempo médio real de execução apurado em minutos
        _links:
          type: object
          description: Links hipermídia para navegação conforme padrão HAL / Spring HATEOAS
          properties:
            self:
              $ref: '#/components/schemas/Link'

    PagedServiceCatalogResponse:
      type: object
      description: Resposta paginada de serviços do catálogo
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/ServiceCatalogSummaryResponse'
        _links:
          $ref: '#/components/schemas/PageLinks'
        page:
          type: integer
          example: 0
          description: Índice da página atual
        size:
          type: integer
          example: 20
          description: Quantidade máxima de registros por página
        totalElements:
          type: integer
          format: int64
          example: 15
          description: Quantidade total de registros encontrados
        totalPages:
          type: integer
          example: 1
          description: Quantidade total de páginas disponíveis

    # -----------------------------------------------------------------------
    # Material Schemas
    # -----------------------------------------------------------------------
    CreateMaterialRequest:
      type: object
      description: Requisição de cadastro de peça ou material
      required:
        - sku
        - name
        - unitPrice
      properties:
        sku:
          type: string
          minLength: 3
          maxLength: 50
          example: 'PART-BRK-01'
          description: Código SKU único da peça
        name:
          type: string
          minLength: 3
          maxLength: 150
          example: 'Pastilha de Freio Dianteira'
          description: Nome da peça ou material
        description:
          type: string
          maxLength: 500
          example: 'Pastilhas cerâmicas para eixo dianteiro'
          description: Descrição técnica ou especificação
        unitCost:
          type: number
          format: double
          minimum: 0.0
          example: 80.00
          description: Custo unitário de aquisição
        unitPrice:
          type: number
          format: double
          minimum: 0.01
          example: 140.00
          description: Preço unitário de venda
        initialStock:
          type: integer
          minimum: 0
          example: 20
          description: Quantidade inicial em estoque
        minStock:
          type: integer
          minimum: 0
          example: 5
          description: Nível mínimo de segurança para reposição

    PatchMaterialRequest:
      type: object
      description: Requisição de atualização parcial dos dados e precificação do material
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 150
          example: 'Pastilha de Freio Cerâmica Premium'
          description: Nome comercial atualizado da peça
        description:
          type: string
          maxLength: 500
          example: 'Pastilhas cerâmicas para alto rendimento'
          description: Descrição atualizada
        unitCost:
          type: number
          format: double
          minimum: 0.0
          example: 85.00
          description: Custo unitário de aquisição atualizado
        unitPrice:
          type: number
          format: double
          minimum: 0.01
          example: 155.00
          description: Preço unitário de venda atualizado
        minStock:
          type: integer
          minimum: 0
          example: 10
          description: Nível mínimo de estoque atualizado

    # =========================================================================
    # Material Schemas (ADR-0003: DTO Granularity & Symmetry)
    # Padrões aplicados:
    # - MaterialDetailedResponse: Detalhes cadastrais completos, buffer e custos
    # - MaterialSummaryResponse: Resumo plano para listagens de estoque e catálogo
    # =========================================================================
    MaterialDetailedResponse:
      type: object
      description: Detalhes cadastrais e de estoque completos da peça/material (inclui buffers e custos)
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único do material
        sku:
          type: string
          description: SKU da peça
        name:
          type: string
          description: Nome do material
        description:
          type: string
          description: Descrição técnica
        unitCost:
          type: number
          format: double
          description: Custo unitário
        unitPrice:
          type: number
          format: double
          description: Preço de venda unitário
        stockQuantity:
          type: integer
          description: Quantidade total física em estoque
        reservedQuantity:
          type: integer
          description: Quantidade reservada para ordens em andamento
        availableQuantity:
          type: integer
          description: Quantidade disponível para novas ordens
        minStock:
          type: integer
          description: Estoque mínimo recomendado
        createdAt:
          type: string
          format: date-time
          description: Data e hora do cadastro
        updatedAt:
          type: string
          format: date-time
          description: Data e hora da última alteração
        _links:
          type: object
          description: Links hipermídia para navegação conforme padrão HAL / Spring HATEOAS
          properties:
            self:
              $ref: '#/components/schemas/Link'

    MaterialSummaryResponse:
      type: object
      description: Resumo plano da peça/material para listagens e seleções no catálogo
      properties:
        id:
          type: string
          format: uuid
          description: Identificador único do material
        sku:
          type: string
          description: SKU da peça
        name:
          type: string
          description: Nome do material
        unitPrice:
          type: number
          format: double
          description: Preço de venda unitário
        availableQuantity:
          type: integer
          description: Quantidade disponível para novas ordens
        _links:
          type: object
          description: Links hipermídia para navegação conforme padrão HAL / Spring HATEOAS
          properties:
            self:
              $ref: '#/components/schemas/Link'

    PagedMaterialResponse:
      type: object
      description: Resposta paginada de peças e materiais
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/MaterialSummaryResponse'
        _links:
          $ref: '#/components/schemas/PageLinks'
        page:
          type: integer
          example: 0
          description: Índice da página atual
        size:
          type: integer
          example: 20
          description: Quantidade máxima de registros por página
        totalElements:
          type: integer
          format: int64
          example: 50
          description: Quantidade total de registros encontrados
        totalPages:
          type: integer
          example: 3
          description: Quantidade total de páginas disponíveis

    # =========================================================================
    # Error Handling Schema (RFC 7807 / RFC 9457: Problem Details for HTTP APIs)
    # Padrão canônico de respostas de erro para APIs HTTP/REST.
    # Provê semântica unificada de falhas operacionais e de regras de negócio,
    # rastreabilidade distribuída (traceId) e código padronizado (errorCode).
    # Content-Type correspondente: application/problem+json
    # =========================================================================
    ProblemDetail:
      type: object
      description: Estrutura padrão de erro conforme especificações RFC 7807 e RFC 9457
      properties:
        type:
          type: string
          format: uri
          description: URI que identifica o tipo do problema
        title:
          type: string
          description: Resumo curto e legível do erro
        status:
          type: integer
          description: Código de status HTTP
        detail:
          type: string
          description: Detalhes explicativos do erro ocorrido
        instance:
          type: string
          format: uri
          description: URI da requisição causadora do erro
        errorCode:
          type: string
          description: Código de erro de negócio padronizado
        timestamp:
          type: string
          format: date-time
          description: Data e hora da ocorrência
        traceId:
          type: string
          description: Identificador de rastreamento distribuído
        fieldErrors:
          type: object
          additionalProperties:
            type: string
          description: Mapa de violações de atributos de entrada (Jakarta Bean Validation / MethodArgumentNotValidException)
          example:
            name: "O nome deve ter entre 3 e 150 caracteres"
            document: "CPF ou CNPJ inválido"
        errors:
          type: array
          items:
            type: string
          description: Lista de violações de regras de negócio ou domínio
          example:
            - "A ordem de serviço não pode ser alterada no status atual"

  responses:
    BadRequest:
      description: Requisição Inválida (Bad Request)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Recurso Não Encontrado (Not Found)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflito de Estado ou Duplicidade de Chave Única (Conflict)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: Erro de Validação ou Regra de Domínio (Unprocessable Entity)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: Erro Inesperado do Servidor (Internal Server Error)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Não Autenticado (Unauthorized)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Acesso Negado (Forbidden)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de autenticação JWT padrão (Cognito / API Gateway)
