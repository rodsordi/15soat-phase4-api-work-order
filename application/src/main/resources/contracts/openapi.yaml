openapi: 3.0.3
info:
  title: API de Ordens de Serviço
  description: |
    Microsserviço responsável pela abertura, gerenciamento, orçamentação e rastreamento de Ordens de Serviço, cadastros de Clientes e Veículos, e catálogos de serviços e materiais da oficina.

    ### 📐 Padrões Arquiteturais e Conformidade Técnica (RFCs & ADRs)
    - **Navegação Hipermídia (HATEOAS / Richardson Maturity Model Nível 3)**:
      - Implementado via padrão HAL (*Hypertext Application Language* - `draft-kelly-json-hal-08` / **RFC 8288**).
      - Respostas expõem o nó `_links` contendo links de autodescoberta (`self`) e relacionamentos de dependência.
      - Suporte a templates de URI parametrizados conforme **RFC 6570** (`templated: boolean`).
      - Identificadores e referências canônicas estruturadas de acordo com **RFC 3986**.
    - **Tratamento Padronizado de Erros (RFC 7807 / RFC 9457)**:
      - Respostas de falha de validação e regras de negócio estruturadas no padrão canônico *Problem Details for HTTP APIs* (`application/problem+json`).
    - **Granularidade e Simetria de DTOs (ADR-0003)**:
      - `*SummaryResponse`: Projeção plana e leve otimizada para listagens paginadas (`Paged*Response`), contendo `_links.self` para navegação direta ao recurso completo.
      - `*DetailedResponse`: Modelo completo para consultas pontuais (`GET /{id}`), incluindo auditoria e relações expandidas.
      - `*ItemResponse`: Representação compacta embutida para entidades associadas (evita acoplamento cíclico e tráfego desnecessário de dados).
  version: 1.0.0
servers:
  - url: http://localhost:8080
    description: Servidor de desenvolvimento local
  - url: /
    description: Gateway / Servidor Atual
security:
  - BearerAuth: []
tags:
  - name: WorkOrder
    description: Operações de gestão do ciclo de vida das Ordens de Serviço
  - name: Customer
    description: Operações de cadastro e consulta de Clientes
  - name: Vehicle
    description: Operações de cadastro e consulta de Veículos
  - name: ServiceCatalog
    description: Operações do catálogo de serviços padronizados e precificação de mão de obra
  - name: Material
    description: Operações do catálogo de peças de reposição, estoque e materiais

paths:
  # =========================================================================
  # Work Order Endpoints
  # =========================================================================
  /api/v1/work-orders:
    post:
      tags:
        - WorkOrder
      summary: Criar uma nova Ordem de Serviço
      operationId: createWorkOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkOrderRequest'
      responses:
        '201':
          description: Ordem de Serviço criada com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/work-orders/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - WorkOrder
      summary: Listar Ordens de Serviço com filtros opcionais e paginação
      operationId: listWorkOrders
      parameters:
        - name: status
          in: query
          required: false
          description: Filtrar por status da Ordem de Serviço
          schema:
            $ref: '#/components/schemas/WorkOrderStatus'
        - name: customerDocument
          in: query
          required: false
          description: Filtrar por documento (CPF ou CNPJ) do cliente
          schema:
            type: string
        - name: licensePlate
          in: query
          required: false
          description: Filtrar por placa do veículo
          schema:
            type: string
        - $ref: '#/components/parameters/CreatedFromQueryParam'
        - $ref: '#/components/parameters/CreatedToQueryParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SortQueryParam'
      responses:
        '200':
          description: Lista paginada de Ordens de Serviço recuperada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedWorkOrderResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/work-orders/{id}:
    get:
      tags:
        - WorkOrder
      summary: Consultar Ordem de Serviço por identificador
      operationId: getWorkOrderById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Detalhes da Ordem de Serviço encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderDetailedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - WorkOrder
      summary: Atualizar Ordem de Serviço parcialmente (Status, etc.)
      operationId: patchWorkOrder
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkOrderStatusRequest'
      responses:
        '200':
          description: Ordem de Serviço atualizada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkOrderDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # Customer Endpoints
  # =========================================================================
  /api/v1/customers:
    post:
      tags:
        - Customer
      summary: Cadastrar um novo Cliente
      operationId: createCustomer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomerRequest'
      responses:
        '201':
          description: Cliente cadastrado com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/customers/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Customer
      summary: Listar ou buscar Clientes com filtros opcionais e paginação
      operationId: listCustomers
      parameters:
        - name: document
          in: query
          required: false
          description: Documento (CPF ou CNPJ) do cliente
          schema:
            type: string
          example: '52998224725'
        - $ref: '#/components/parameters/CreatedFromQueryParam'
        - $ref: '#/components/parameters/CreatedToQueryParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SortQueryParam'
      responses:
        '200':
          description: Lista paginada de clientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCustomerResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/customers/{id}:
    get:
      tags:
        - Customer
      summary: Consultar Cliente por identificador único (UUID)
      operationId: getCustomerById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Detalhes do cliente localizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Customer
      summary: Atualizar dados cadastrais do Cliente parcialmente
      operationId: updateCustomer
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchCustomerRequest'
      responses:
        '200':
          description: Dados do cliente atualizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Customer
      summary: Excluir Cliente por identificador único (UUID)
      operationId: deleteCustomerById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Cliente removido com sucesso
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # Vehicle Endpoints
  # =========================================================================
  /api/v1/vehicles:
    post:
      tags:
        - Vehicle
      summary: Cadastrar um novo Veículo vinculado a um Cliente
      operationId: createVehicle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
      responses:
        '201':
          description: Veículo cadastrado com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/vehicles/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Vehicle
      summary: Listar ou buscar Veículos com filtros opcionais e paginação
      operationId: listVehicles
      parameters:
        - name: licensePlate
          in: query
          required: false
          description: Placa do veículo (padrão Mercosul ou antigo)
          schema:
            type: string
          example: 'BRA2E19'
        - name: customerDocument
          in: query
          required: false
          description: Documento (CPF ou CNPJ) do cliente proprietário para filtragem
          schema:
            type: string
            pattern: '^\d{11}$|^\d{14}$'
          example: '52998224725'
        - $ref: '#/components/parameters/CreatedFromQueryParam'
        - $ref: '#/components/parameters/CreatedToQueryParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SortQueryParam'
      responses:
        '200':
          description: Lista paginada de veículos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedVehicleResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/vehicles/{id}:
    get:
      tags:
        - Vehicle
      summary: Consultar Veículo por identificador único (UUID)
      operationId: getVehicleById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Detalhes do veículo localizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetailedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Vehicle
      summary: Atualizar dados cadastrais do Veículo parcialmente
      operationId: updateVehicle
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchVehicleRequest'
      responses:
        '200':
          description: Dados do veículo atualizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VehicleDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Vehicle
      summary: Excluir Veículo por identificador único (UUID)
      operationId: deleteVehicleById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Veículo removido com sucesso
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # Service Catalog Endpoints
  # =========================================================================
  /api/v1/services:
    post:
      tags:
        - ServiceCatalog
      summary: Cadastrar um novo serviço padronizado no catálogo
      operationId: createService
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceCatalogRequest'
      responses:
        '201':
          description: Serviço cadastrado no catálogo com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/services/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - ServiceCatalog
      summary: Listar todos os serviços do catálogo com filtro por código e paginação
      operationId: listServices
      parameters:
        - name: code
          in: query
          required: false
          description: Código padronizado do serviço para filtragem exata
          schema:
            type: string
          example: 'SRV-OIL-01'
        - $ref: '#/components/parameters/CreatedFromQueryParam'
        - $ref: '#/components/parameters/CreatedToQueryParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SortQueryParam'
      responses:
        '200':
          description: Lista paginada de serviços do catálogo recuperada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedServiceCatalogResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/services/metrics:
    get:
      tags:
        - ServiceCatalog
      summary: Apurar e consultar métricas de tempo médio de execução dos serviços do catálogo
      operationId: getServiceMetrics
      parameters:
        - name: serviceCode
          in: query
          required: false
          description: Código padronizado do serviço para filtragem exata
          schema:
            type: string
          example: 'SRV-OIL-01'
      responses:
        '200':
          description: Métricas de tempo médio de execução dos serviços recuperadas com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceMetricsResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/services/{id}:
    get:
      tags:
        - ServiceCatalog
      summary: Consultar serviço do catálogo por ID
      operationId: getServiceById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Detalhes do serviço localizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogDetailedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - ServiceCatalog
      summary: Atualizar dados cadastrais ou preço de um serviço no catálogo
      operationId: updateService
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchServiceCatalogRequest'
      responses:
        '200':
          description: Serviço do catálogo atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceCatalogDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - ServiceCatalog
      summary: Remover item do catálogo de serviços
      operationId: deleteService
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Serviço removido com sucesso
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # =========================================================================
  # Material Catalog Endpoints
  # =========================================================================
  /api/v1/materials:
    post:
      tags:
        - Material
      summary: Cadastrar uma nova peça ou material no catálogo
      operationId: createMaterial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaterialRequest'
      responses:
        '201':
          description: Material cadastrado com sucesso
          headers:
            Location:
              description: URI canônica do recurso criado
              schema:
                type: string
                example: '/api/v1/materials/3fa85f64-5717-4562-b3fc-2c963f66afa6'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    get:
      tags:
        - Material
      summary: Listar todas as peças e materiais com filtro por SKU e paginação
      operationId: listMaterials
      parameters:
        - name: sku
          in: query
          required: false
          description: SKU único da peça/material para filtragem exata
          schema:
            type: string
          example: 'PART-BRK-01'
        - $ref: '#/components/parameters/CreatedFromQueryParam'
        - $ref: '#/components/parameters/CreatedToQueryParam'
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/SizeQueryParam'
        - $ref: '#/components/parameters/SortQueryParam'
      responses:
        '200':
          description: Lista paginada de materiais recuperada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedMaterialResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/materials/{id}:
    get:
      tags:
        - Material
      summary: Consultar detalhes de um material por ID
      operationId: getMaterialById
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '200':
          description: Detalhes do material localizados com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetailedResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    patch:
      tags:
        - Material
      summary: Atualizar dados cadastrais, preços de venda ou custo de um material
      operationId: updateMaterial
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMaterialRequest'
      responses:
        '200':
          description: Material atualizado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialDetailedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Material
      summary: Remover material do catálogo
      operationId: deleteMaterial
      parameters:
        - $ref: '#/components/parameters/IdPathParam'
      responses:
        '204':
          description: Material removido com sucesso
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  parameters:
    PageQueryParam:
      name: page
      in: query
      required: false
      description: Índice da página (iniciando em 0)
      schema:
        type: integer
        default: 0
        minimum: 0
      example: 0

    SizeQueryParam:
      name: size
      in: query
      required: false
      description: Quantidade máxima de registros retornados por página
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      example: 20

    SortQueryParam:
      name: sort
      in: query
      required: false
      description: 'Critério de ordenação dinâmico no padrão Spring Data (ex: createdAt,desc ou name,asc)'
      schema:
        type: string
      example: 'createdAt,desc'

    CreatedFromQueryParam:
      name: createdFrom
      in: query
      required: false
      description: Data/hora inicial de criação (ISO 8601 UTC)
      schema:
        type: string
        format: date-time
      example: '2026-10-01T00:00:00Z'

    CreatedToQueryParam:
      name: createdTo
      in: query
      required: false
      description: Data/hora final de criação (ISO 8601 UTC)
      schema:
        type: string
        format: date-time
      example: '2026-10-07T23:59:59Z'

    IdPathParam:
      name: id
      in: path
      required: true
      description: Identificador único do recurso no padrão UUID
      schema:
        type: string
        format: uuid
      example: '3fa85f64-5717-4562-b3fc-2c963f66afa6'

  schemas:
    # -----------------------------------------------------------------------
    # Work Order Schemas
    # -----------------------------------------------------------------------
    CreateWorkOrderRequest:
      type: object
      description: Requisição para abertura de Ordem de Serviço
      required:
        - customerDocument
        - licensePlate
        - description
      properties:
        customerDocument:
          type: string
          pattern: '^\d{11}$|^\d{14}$'
          minLength: 11
          maxLength: 14
          example: '52998224725'
          description: Documento (CPF ou CNPJ) do cliente solicitante
        licensePlate:
          type: string
          pattern: '^[A-Z]{3}[0-9][A-Z0-9][0-9]{2}$|^[A-Z]{3}-?[0-9]{4}$'
          maxLength: 10
          example: 'BRA2E19'
          description: Placa do veículo associado
        description:
          type: string
          minLength: 5
          maxLength: 500
          example: 'Manutenção periódica e revisão dos freios'
          description: Descrição do problema ou solicitação relatada
        services:
          type: array
          description: Lista opcional de serviços pré-cadastrados a serem incluídos na abertura
          items:
            $ref: '#/components/schemas/WorkOrderServiceItemRequest'
        materials:
          type: array
          description: Lista opcional de peças/materiais pré-cadastrados a serem incluídos na abertura
          items:
            $ref: '#/components/schemas/WorkOrderMaterialItemRequest'

    WorkOrderServiceItemRequest:
      type: object
      description: Referência a serviço pré-cadastrado no catálogo
      required:
