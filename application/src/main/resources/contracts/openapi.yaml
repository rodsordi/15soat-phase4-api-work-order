        totalElements:
          type: integer
          format: int64
          example: 50
          description: |
            Quantidade total de registros encontrados na base de dados para o critério consultado.
        totalPages:
          type: integer
          example: 3
          description: |
            Quantidade total de páginas calculadas disponíveis para navegação.

    # =========================================================================
    # Error Handling Schema (RFC 7807 / RFC 9457: Problem Details for HTTP APIs)
    # Padrão canônico de respostas de erro para APIs HTTP/REST.
    # Provê semântica unificada de falhas operacionais e de regras de negócio,
    # rastreabilidade distribuída (traceId) e código padronizado (errorCode).
    # Content-Type correspondente: application/problem+json
    # =========================================================================
    ProblemDetail:
      type: object
      description: Estrutura padrão de erro conforme especificações RFC 7807 e RFC 9457
      example:
        type: 'https://api.fiap.com.br/errors/bad-request'
        title: 'Bad Request'
        status: 400
        detail: 'Atributos inválidos na requisição ou violação de regra de negócio'
        instance: '/api/v1/work-orders'
        errorCode: 'INVALID_ARGUMENT'
        timestamp: '2026-10-08T10:30:00Z'
        traceId: 'c3d8e5f2a1b4c7d9'
        fieldErrors:
          campo: 'Descrição da violação de validação'
        errors:
          - 'Descrição da inconsistência ou violação de regra'
      properties:
        type:
          type: string
          format: uri
          description: |
            URI absoluta de referência que identifica a categoria semântica do tipo do problema (**RFC 7807** / **RFC 9457**).
        title:
          type: string
          description: |
            Resumo curto, estável e legível por humanos sobre o problema ocorrido.
        status:
          type: integer
          description: |
            Código de status HTTP numérico retornado pelo servidor na resposta (ex: `400`, `404`, `409`, `422`, `500`).
        detail:
          type: string
          description: |
            Explicação humana contextualizada e específica sobre esta ocorrência pontual do problema.
        instance:
          type: string
          format: uri
          description: |
            URI relativa do endpoint e recurso específico que originou a requisição causadora do erro.
        errorCode:
          type: string
          description: |
            Código mnemônico padronizado de erro de negócio para tratamento programático pelos clientes da API (ex: `INVALID_ARGUMENT`, `RESOURCE_NOT_FOUND`).
        timestamp:
          type: string
          format: date-time
          description: |
            Carimbo de data e hora em que a falha foi registrada no servidor (**ISO-8601 UTC**).
        traceId:
          type: string
          description: |
            Identificador único de rastreabilidade distribuída para correlação em logs e observabilidade (**APM** / **OpenTelemetry**).
        fieldErrors:
          type: object
          additionalProperties:
            type: string
          description: |
            Dicionário contendo as violações de validação por atributo (`campo` -> mensagem de erro) originadas de validações **Jakarta Bean Validation**.
        errors:
          type: array
          items:
            type: string
          description: |
            Lista contendo mensagens detalhadas de violação de invariantes de negócio ou validações de domínio.

  headers:
    CorrelationIdHeader:
      description: Identificador único de correlação transacional distribuída (UUID v4) refletido na resposta para rastreabilidade
      schema:
        type: string
        format: uuid
      example: 'c3d8e5f2-a1b4-47d9-9e8c-7f6a5b4c3d2e'

  responses:
    BadRequest:
      description: Requisição Inválida (Bad Request) - Violação de validação ou argumentos incorretos
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFound:
      description: Recurso Não Encontrado (Not Found) - Identificador inexistente na base de dados
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Conflict:
      description: Conflito de Estado ou Duplicidade (Conflict) - Recurso já existente ou estado incompatível
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnprocessableEntity:
      description: Erro de Regra de Negócio (Unprocessable Entity) - Violação de invariantes de domínio
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InternalServerError:
      description: Erro Inesperado do Servidor (Internal Server Error) - Falha interna não tratada
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Unauthorized:
      description: Não Autenticado (Unauthorized) - Credenciais ausentes ou token expirado
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Forbidden:
      description: Acesso Negado (Forbidden) - Permissões insuficientes para a operação
      headers:
        X-Correlation-Id:
          $ref: '#/components/headers/CorrelationIdHeader'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token de autenticação JWT padrão (Cognito / API Gateway)
