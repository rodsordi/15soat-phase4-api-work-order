          example: 150.00
          description: Preço unitário aplicado
        quantity:
          type: integer
          example: 1
          description: Quantidade aplicada
        subtotal:
          type: number
          format: double
          example: 150.00
          description: Subtotal deste item
        _links:
          type: object
          description: Links hipermídia para navegação conforme padrão HAL / Spring HATEOAS
